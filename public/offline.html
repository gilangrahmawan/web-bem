<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#232361">
    <title>Sedang offline — BEM UBHINUS</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: #f8fafc;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #0f172a; text-align: center; }
        main { max-width: 26rem; }
        img { width: 88px; height: 88px; }
        h1 { font-size: 1.35rem; margin: 1rem 0 .5rem; color: #232361; }
        p { color: #475569; line-height: 1.5; }
        button { margin-top: 1rem; padding: .75rem 1.5rem; border: 0; border-radius: .75rem; background: #232361; color: #fff; font-weight: 700; font-size: 1rem; }
    </style>
</head>
<body>
    <main>
        <img src="/images/icon-192.png" alt="Logo BEM UBHINUS">
        <h1>Anda sedang offline</h1>
        <p>Dashboard butuh koneksi internet. Data pengurus tidak disimpan di perangkat demi keamanan. Periksa koneksi lalu coba lagi.</p>
        <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
</body>
</html>
